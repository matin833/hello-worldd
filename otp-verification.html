<style>
.otp-container {
    background-color: #F2F2F2;
    padding: 20px;
    text-align: center;
}

.otp-input-wrapper {
    border-bottom: 1px solid #c1d2f0;
    padding-bottom: 15px;
    margin-bottom: 10px;
}

.otp-input {
    border: #999 solid 1px;
    font-size: 13px;
    color: #676566;
    background-color: #ffffff;
    background-image: none;
    width: 140px;
    padding: 4px;
    font-family: Tahoma, Helvetica, Arial, sans-serif;
    border-radius: 0;
    box-sizing: border-box;
}

.otp-input:focus {
    outline: none;
}

.otp-buttons {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.otp-btn {
    background-color: #636162;
    background-image: none;
    color: #ffffff;
    border: none;
    border-radius: 0;
    padding: 5px;
    font-size: 15px;
    font-weight: normal;
    font-family: Tahoma, Helvetica, Arial, sans-serif;
    cursor: pointer;
    text-transform: uppercase;
    height: 35px;
    margin: 10px 3px;
    min-width: 90px;
    width: auto;
    overflow: visible;
}

.otp-btn:hover {
    background-color: #4e81c0;
    background-image: none;
    cursor: pointer;
}

/* PDF Container - initially hidden */
.pdf-container {
    display: none;
    padding: 20px;
}
</style>

<div class="otp-container" id="otpForm">
    <div class="otp-input-wrapper">
        <input type="text" class="otp-input" id="otpInput" maxlength="8">
    </div>

    <div class="otp-buttons">
        <input type="button" class="otp-btn" id="submitBtn" onclick="verifyOTP()" value="Submit">
        <input type="button" class="otp-btn" id="resendBtn" onclick="resendOTP()" value="Resend OTP">
    </div>
</div>

<!-- PDF Container - add your PDF embed here -->
<div class="pdf-container" id="pdfContainer">
    <!-- Your PDF element goes here -->
</div>

<script>
const CORRECT_OTP = '12345678';
const RESEND_PAGE_URL = window.location.href; // Change this to your specific page URL if needed

function verifyOTP() {
    const otpInput = document.getElementById('otpInput');
    const invalidBanner = document.getElementById('invalid');
    const otpForm = document.getElementById('otpForm');
    const pdfContainer = document.getElementById('pdfContainer');

    const enteredOTP = otpInput.value.trim();

    if (enteredOTP === CORRECT_OTP) {
        // Correct OTP - hide form and invalid banner, show PDF
        if (invalidBanner) {
            invalidBanner.style.display = 'none';
        }
        otpForm.style.display = 'none';
        pdfContainer.style.display = 'block';
    } else {
        // Wrong OTP - show the existing Elementor invalid element
        if (invalidBanner) {
            invalidBanner.style.display = 'block';
        }
    }
}

function resendOTP() {
    // Reload the page
    window.location.href = RESEND_PAGE_URL;
}

// Allow Enter key to submit
document.getElementById('otpInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        verifyOTP();
    }
});
</script>
