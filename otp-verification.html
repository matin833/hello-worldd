<style>
.send-otp-container {
    text-align: center;
}

.send-otp-btn {
    display: inline-block;
    background-color: #636162;
    color: #FFFFFF !important;
    font-family: Tahoma, Sans-serif;
    font-size: 15px;
    font-weight: normal;
    text-decoration: none;
    text-transform: uppercase;
    padding: 13px 15px 12px 15px;
    border-radius: 0;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s;
}

.send-otp-btn:hover,
.send-otp-btn:focus,
.send-otp-btn:visited {
    background-color: #4e81c0;
    color: #FFFFFF;
    text-decoration: none;
}

.otp-container {
    background-color: #F2F2F2;
    padding: 20px;
    text-align: center;
}

.otp-input-wrapper {
    border-bottom: 1px solid #c1d2f0;
    padding-bottom: 15px;
    margin-bottom: 10px;
}

.otp-input {
    border: #999 solid 1px;
    font-size: 13px;
    color: #676566;
    background-color: #ffffff;
    background-image: none;
    padding: 4px;
    font-family: Tahoma, Helvetica, Arial, sans-serif;
    border-radius: 0;
    box-sizing: border-box;
    width: 30% !important;
}

.otp-input:focus {
    outline: none;
}

.otp-buttons {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.otp-btn {
    background-color: #636162;
    background-image: none;
    color: #ffffff;
    border: none;
    border-radius: 0;
    padding: 5px;
    font-size: 15px;
    font-weight: normal;
    font-family: Tahoma, Helvetica, Arial, sans-serif;
    cursor: pointer;
    text-transform: uppercase;
    height: 35px;
    margin: 10px 3px;
    min-width: 90px;
    width: auto;
    overflow: visible;
}

.otp-btn:hover {
    background-color: #4e81c0;
    background-image: none;
    cursor: pointer;
}

#popupTrigger {
    display: none;
}
</style>

<!-- Step 1: Send OTP button -->
<div class="send-otp-container" id="sendOtpSection">
    <a href="#elementor-action%3Aaction%3Dpopup%3Aopen%26settings%3DeyJpZCI6IjI3ODMiLCJ0b2dnbGUiOmZhbHNlfQ%3D%3D" class="send-otp-btn" onclick="handleSendOTP()">Send OTP</a>
</div>

<!-- Step 2: OTP entry (hidden initially) -->
<div class="otp-container" id="otpForm" style="display: none;">
    <div class="otp-input-wrapper">
        <input type="text" class="otp-input" id="otpInput" maxlength="8">
    </div>

    <div class="otp-buttons">
        <input type="button" class="otp-btn" id="submitBtn" onclick="verifyOTP()" value="Submit">
        <input type="button" class="otp-btn" id="resendBtn" onclick="resendOTP()" value="Resend OTP">
    </div>
</div>

<!-- Hidden link to trigger Elementor popup on Resend -->
<a id="popupTrigger" href="#elementor-action%3Aaction%3Dpopup%3Aopen%26settings%3DeyJpZCI6IjI3ODMiLCJ0b2dnbGUiOmZhbHNlfQ%3D%3D"></a>

<script>
const CORRECT_OTP = '12345678';

// ========== CHANGE THESE IDs TO MATCH YOUR ELEMENTOR ELEMENTS ==========
const PDF_ELEMENT_ID = 'pdf-show';
const INVALID_BANNER_ID = 'invalid';
// =======================================================================

function handleSendOTP() {
    // Hide Send OTP button
    document.getElementById('sendOtpSection').style.display = 'none';
    // Show OTP entry form
    document.getElementById('otpForm').style.display = 'block';
}

function verifyOTP() {
    var otpInput = document.getElementById('otpInput');
    var otpForm = document.getElementById('otpForm');
    var pdfContainer = document.getElementById(PDF_ELEMENT_ID);
    var invalidBanner = document.getElementById(INVALID_BANNER_ID);

    var enteredOTP = otpInput.value.trim();

    if (enteredOTP === CORRECT_OTP) {
        if (invalidBanner) {
            invalidBanner.style.setProperty('display', 'none', 'important');
        }
        otpForm.style.display = 'none';
        if (pdfContainer) {
            pdfContainer.style.setProperty('display', 'block', 'important');
        }
    } else {
        if (invalidBanner) {
            invalidBanner.style.setProperty('display', 'block', 'important');
        }
    }
}

function resendOTP() {
    var popupLink = document.getElementById('popupTrigger');
    if (popupLink) {
        popupLink.click();
    }
}

document.getElementById('otpInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        verifyOTP();
    }
});
</script>
