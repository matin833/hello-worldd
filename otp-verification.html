<style>
.otp-container {
    background-color: #F2F2F2;
    padding: 20px;
    text-align: center;
}

.otp-input-wrapper {
    border-bottom: 1px solid #c1d2f0;
    padding-bottom: 15px;
    margin-bottom: 10px;
}

.otp-input {
    border: #999 solid 1px;
    font-size: 13px;
    color: #676566;
    background-color: #ffffff;
    background-image: none;
    padding: 4px;
    font-family: Tahoma, Helvetica, Arial, sans-serif;
    border-radius: 0;
    box-sizing: border-box;
    width: 30% !important;
}

.otp-input:focus {
    outline: none;
}

.otp-buttons {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.otp-btn {
    background-color: #636162;
    background-image: none;
    color: #ffffff;
    border: none;
    border-radius: 0;
    padding: 5px;
    font-size: 15px;
    font-weight: normal;
    font-family: Tahoma, Helvetica, Arial, sans-serif;
    cursor: pointer;
    text-transform: uppercase;
    height: 35px;
    margin: 10px 3px;
    min-width: 90px;
    width: auto;
    overflow: visible;
}

.otp-btn:hover {
    background-color: #4e81c0;
    background-image: none;
    cursor: pointer;
}
</style>

<div class="otp-container" id="otpForm">
    <div class="otp-input-wrapper">
        <input type="text" class="otp-input" id="otpInput" maxlength="8">
    </div>

    <div class="otp-buttons">
        <input type="button" class="otp-btn" id="submitBtn" onclick="verifyOTP()" value="Submit">
        <input type="button" class="otp-btn" id="resendBtn" onclick="resendOTP()" value="Resend OTP">
    </div>
</div>

<script>
const CORRECT_OTP = '12345678';
const RESEND_PAGE_URL = window.location.href;

// ========== CHANGE THESE IDs TO MATCH YOUR ELEMENTOR ELEMENTS ==========
const PDF_ELEMENT_ID = 'pdfDocument';      // <-- Your PDF element's ID
const INVALID_BANNER_ID = 'invalid';       // <-- Your "OTP is invalid" element's ID
// =======================================================================

function verifyOTP() {
    const otpInput = document.getElementById('otpInput');
    const otpForm = document.getElementById('otpForm');
    const pdfContainer = document.getElementById(PDF_ELEMENT_ID);
    const invalidBanner = document.getElementById(INVALID_BANNER_ID);

    const enteredOTP = otpInput.value.trim();

    if (enteredOTP === CORRECT_OTP) {
        if (invalidBanner) {
            invalidBanner.style.setProperty('display', 'none', 'important');
        }
        otpForm.style.display = 'none';
        if (pdfContainer) {
            pdfContainer.style.setProperty('display', 'block', 'important');
        }
    } else {
        if (invalidBanner) {
            invalidBanner.style.setProperty('display', 'block', 'important');
        }
    }
}

function resendOTP() {
    window.location.href = RESEND_PAGE_URL;
}

document.getElementById('otpInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        verifyOTP();
    }
});
</script>
