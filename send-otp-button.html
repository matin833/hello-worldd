<style>
.send-otp-container {
    text-align: center;
}

.send-otp-btn {
    display: inline-block;
    background-color: #636162;
    color: #FFFFFF;
    font-family: Tahoma, Sans-serif;
    font-size: 15px;
    font-weight: normal;
    text-decoration: none;
    text-transform: uppercase;
    padding: 13px 15px 12px 15px;
    border-radius: 0;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s;
}

.send-otp-btn:hover,
.send-otp-btn:focus,
.send-otp-btn:visited {
    background-color: #4e81c0;
    color: #FFFFFF;
    text-decoration: none;
}
</style>

<div class="send-otp-container">
    <a href="#elementor-action%3Aaction%3Dpopup%3Aopen%26settings%3DeyJpZCI6IjI3ODMiLCJ0b2dnbGUiOmZhbHNlfQ%3D%3D" class="send-otp-btn" onclick="handleSendOTP()">Send OTP</a>
</div>

<script>
function handleSendOTP() {
    // Hide the Send OTP section
    var otpSection = document.getElementById('otp');
    if (otpSection) {
        otpSection.style.setProperty('display', 'none', 'important');
    }

    // Show the password entry section
    var passwordSection = document.getElementById('password');
    if (passwordSection) {
        passwordSection.style.setProperty('display', 'block', 'important');
    }

    // Popup opens via the href automatically
}
</script>
